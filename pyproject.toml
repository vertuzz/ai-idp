[project]
name = "ai-idp"
version = "0.1.0"
description = "Evaluation-first, AI-directed intelligent document processing"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
evaluation = [
    "fonttools>=4.67.0",
    "ijson>=3.6.0",
    "pillow==12.3.0",
    "pyarrow>=21",
    "pypdf[crypto]>=6.21.1",
    "python-docx>=1.2.0",
    "remotezip>=0.12.6",
    "reportlab==4.4.9",
]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["eval/cache", "eval/downloads"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
